name: Validate addon release
on:
  push:
  pull_request:
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
      - run: python scripts/validate_release.py
      - name: Check all addon JavaScript
        run: |
          while IFS= read -r -d '' file; do
            node --check "$file" || exit 1
          done < <(find co_* -type f -name '*.js' -print0)
      - run: git diff --check
